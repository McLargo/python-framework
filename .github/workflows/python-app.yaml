---
# This workflow will install Python dependencies, check python code (format,
# linters...) and run tests with a single version of Python.
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python framework

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt;
          fi
      - name: Pyrefly typing
        run: |
          pyrefly check .

      - name: Bandit
        run: |
          bandit backend -c=backend/pyproject.toml

      - name: Ruff linter
        run: |
          ruff check .

      - name: Ruff format
        run: |
          ruff format . --check --diff

      - name: Detect secrets
        run: |
          detect-secrets scan .

      - name: Toml sort
        run: |
          toml-sort -i backend/pyproject.toml --check

      - name: Yaml lint
        run: |
          yamllint .

      - name: Run test with pytest
        run: |
          pytest --cov=.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

version: '3'

vars:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  COMPOSE_FILE: docker/compose.yaml
  POETRY: poetry run

tasks:
  init:
    dir: '{{.BACKEND_DIR}}'
    desc: initialize the backend environment
    cmds:
      - poetry install
      - '{{.POETRY}} pre-commit install'

  lint:
    dir: '{{.BACKEND_DIR}}'
    desc: run all linters
    cmds:
      - '{{.POETRY}} ruff check .'
      - '{{.POETRY}} ruff format . --check --diff'
      - '{{.POETRY}} yamllint .'

  hint:
    dir: '{{.BACKEND_DIR}}'
    desc: run the hints
    cmds:
      - '{{.POETRY}} pyrefly check .'

  unit:
    dir: '{{.BACKEND_DIR}}'
    desc: run unit tests
    cmds:
      - '{{.POETRY}} pytest -m unit'

  functional:
    dir: '{{.BACKEND_DIR}}'
    desc: run functional tests
    cmds:
      - '{{.POETRY}} pytest -m functional'

  test:
    dir: '{{.BACKEND_DIR}}'
    desc: run all tests
    cmds:
      - '{{.POETRY}} pytest'

  coverage:
    dir: '{{.BACKEND_DIR}}'
    desc: run tests with coverage report
    cmds:
      - '{{.POETRY}} pytest --cov-fail-under=100 --cov-report=html --cov=.'

  vulnerability:
    dir: '{{.BACKEND_DIR}}'
    desc: run vulnerability and security checks
    cmds:
      - '{{.POETRY}} bandit . -c=pyproject.toml -r'
      - '{{.POETRY}} detect-secrets scan .'

  frontend:init:
    dir: '{{.FRONTEND_DIR}}'
    desc: install frontend dependencies
    cmds:
      - npm install

  frontend:dev:
    dir: '{{.FRONTEND_DIR}}'
    desc: start the frontend development server
    cmds:
      - npm run dev

  frontend:build:
    dir: '{{.FRONTEND_DIR}}'
    desc: build the frontend for production
    cmds:
      - npm run build

  frontend:preview:
    dir: '{{.FRONTEND_DIR}}'
    desc: preview the production frontend build
    cmds:
      - npm run preview

  docker:build:
    desc: build the Docker Compose services
    cmds:
      - docker compose -f '{{.COMPOSE_FILE}}' build

  docker:up:
    desc: start the Docker Compose services
    cmds:
      - docker compose -f '{{.COMPOSE_FILE}}' up -d

  docker:down:
    desc: stop and remove the Docker Compose services
    cmds:
      - docker compose -f '{{.COMPOSE_FILE}}' down

  docker:ps:
    desc: list the Docker Compose services
    cmds:
      - docker compose -f '{{.COMPOSE_FILE}}' ps
